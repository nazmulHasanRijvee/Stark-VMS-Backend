spring.application.name=vms
server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stark_vms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true

app.jwt.secret=${VMS_JWT_SECRET:}
app.jwt.access-token-lifetime=${VMS_JWT_ACCESS_TOKEN_LIFETIME:PT24H}
app.seed.demo-data=${APP_SEED_DEMO_DATA:false}
app.cors.allowed-origins=${VMS_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.business-time-zone=${VMS_BUSINESS_TIME_ZONE:Asia/Dhaka}
app.supabase.s3-endpoint=${SUPABASE_S3_ENDPOINT:}
app.supabase.s3-region=${SUPABASE_S3_REGION:}
app.supabase.s3-access-key-id=${SUPABASE_S3_ACCESS_KEY_ID:}
app.supabase.s3-secret-access-key=${SUPABASE_S3_SECRET_ACCESS_KEY:}
app.supabase.bucket=${SUPABASE_STORAGE_BUCKET:}
app.supabase.signed-url-ttl-seconds=${SUPABASE_SIGNED_URL_TTL_SECONDS:300}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
