spring.application.name=vms
server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stark_vms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true

app.jwt.secret=${VMS_JWT_SECRET:}
app.jwt.access-token-lifetime=${VMS_JWT_ACCESS_TOKEN_LIFETIME:PT24H}
app.seed.demo-data=${APP_SEED_DEMO_DATA:false}
app.cors.allowed-origins=${VMS_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
